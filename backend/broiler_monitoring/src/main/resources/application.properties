spring.application.name=broiler_monitoring
server.port=8080
spring.config.import=optional:file:.env[.properties]



spring.datasource.url=jdbc:postgresql://127.0.0.1:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

telemetry.influx.url=http://localhost:8086
telemetry.influx.database=broiler_telemetry

sensor.simulation.enabled=true
sensor.simulation.target-url=http://localhost:8080/api/v1/telemetry/readings
TELEMETRY_INFLUX_URL=http://localhost:8086
sensor.simulation.gateway-id=GW-FARM-1-HOUSE-4
sensor.simulation.interval-ms=600000
sensor.simulation.initial-delay-ms=15000

spring.servlet.multipart.max-file-size=${INCIDENT_ATTACHMENTS_MAX_FILE_SIZE:300MB}
spring.servlet.multipart.max-request-size=${INCIDENT_ATTACHMENTS_MAX_REQUEST_SIZE:900MB}

incident.attachments.max-file-size-bytes=${INCIDENT_ATTACHMENTS_MAX_FILE_SIZE_BYTES:314572800}
incident.attachments.s3.endpoint=${INCIDENT_ATTACHMENTS_S3_ENDPOINT:http://localhost:9000}
incident.attachments.s3.region=${INCIDENT_ATTACHMENTS_S3_REGION:us-east-1}
incident.attachments.s3.bucket=${INCIDENT_ATTACHMENTS_S3_BUCKET:broiler-incident-attachments}
incident.attachments.s3.access-key=${INCIDENT_ATTACHMENTS_S3_ACCESS_KEY:minioadmin}
incident.attachments.s3.secret-key=${INCIDENT_ATTACHMENTS_S3_SECRET_KEY:minioadmin}
incident.attachments.s3.path-style-access=${INCIDENT_ATTACHMENTS_S3_PATH_STYLE_ACCESS:true}

