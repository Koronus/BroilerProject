services:
  postgres:
    image: postgres:16
    container_name: broiler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-broiler_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-broiler_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-broiler_pass}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  influxdb:
    image: influxdb:1.8
    restart: unless-stopped
    environment:
      INFLUXDB_DB: broiler_telemetry
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    ports:
      - "8086:8086"
    volumes:
      - broiler_influxdb_data:/var/lib/influxdb
    healthcheck:
      test: [ "CMD-SHELL", "influx -execute 'SHOW DATABASES'" ]
      interval: 10s
      timeout: 5s
      retries: 10
  grafana:
    image: grafana/grafana:latest
    container_name: broiler-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    volumes:
      - broiler_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
  minio:
    image: minio/minio:latest
    container_name: broiler-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${INCIDENT_ATTACHMENTS_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${INCIDENT_ATTACHMENTS_S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - broiler_minio_data:/data
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${INCIDENT_ATTACHMENTS_S3_ACCESS_KEY:-minioadmin} ${INCIDENT_ATTACHMENTS_S3_SECRET_KEY:-minioadmin}; do sleep 2; done;
      mc mb -p --ignore-existing local/${INCIDENT_ATTACHMENTS_S3_BUCKET:-broiler-incident-attachments};
      exit 0;
      "

volumes:
  postgres_data:
  broiler_influxdb_data:
  broiler_grafana_data:
  broiler_minio_data:
