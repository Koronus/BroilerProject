services:
  postgres:
    image: postgres:16
    container_name: broiler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-broiler_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-broiler_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-broiler_pass}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data



volumes:
  postgres_data:
