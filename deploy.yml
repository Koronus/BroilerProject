services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-broiler_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-broiler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-broiler_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-broiler} -d ${POSTGRES_DB:-broiler_monitoring}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - broiler-network

  backend:
    image: maven:3.9-eclipse-temurin-21
    restart: unless-stopped
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-broiler_monitoring}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-broiler}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-broiler_password}
      POSTGRES_DB: ${POSTGRES_DB:-broiler_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-broiler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-broiler_password}
      POSTGRES_PORT: 5432
    ports:
      - "8081:8080"
    volumes:
      - ./backend/broiler_monitoring:/app
      - maven_cache:/root/.m2
      - backend_target:/app/target
    command: mvn -DskipTests spring-boot:run
    networks:
      - broiler-network

  frontend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    environment:
      SPRING_API_URL: http://backend:8080
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: sh -c "npm ci && npm run build && npm run start -- -H 0.0.0.0 -p 3000"
    networks:
      - broiler-network

  sensor-imitation:
    image: python:3.12-alpine
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080/api/v1/telemetry/readings
      GATEWAY_ID: GW-FARM-1-HOUSE-4
      INTERVAL_SECONDS: 600
    volumes:
      - ./sensorImitation:/app:ro
    command:
      - sh
      - -c
      - |
        python - <<'PY'
        import time
        from urllib.request import urlopen

        url = "http://backend:8080/api/v1/notification"
        print("Waiting for backend...")

        for _ in range(120):
            try:
                urlopen(url, timeout=2).close()
                print("Backend is ready")
                break
            except Exception:
                time.sleep(5)
        else:
            raise SystemExit("Backend is not ready")
        PY
        python sensor_simulator.py
    networks:
      - broiler-network

volumes:
  postgres_data:
  maven_cache:
  backend_target:
  frontend_node_modules:
  frontend_next:

networks:
  broiler-network:
    driver: bridge
