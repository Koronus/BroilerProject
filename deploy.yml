services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-broiler_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-broiler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-broiler_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-broiler} -d ${POSTGRES_DB:-broiler_monitoring}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - broiler-network

  influxdb:
    image: influxdb:1.8
    restart: unless-stopped
    environment:
      INFLUXDB_DB: ${INFLUXDB_DB:-broiler_telemetry}
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb
    healthcheck:
      test: ["CMD-SHELL", "influx -execute 'SHOW DATABASES'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - broiler-network

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - broiler-network

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${INCIDENT_ATTACHMENTS_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${INCIDENT_ATTACHMENTS_S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - broiler-network

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${INCIDENT_ATTACHMENTS_S3_ACCESS_KEY:-minioadmin} ${INCIDENT_ATTACHMENTS_S3_SECRET_KEY:-minioadmin}; do sleep 2; done;
      mc mb -p --ignore-existing local/${INCIDENT_ATTACHMENTS_S3_BUCKET:-broiler-incident-attachments};
      exit 0;
      "
    networks:
      - broiler-network

  backend:
    image: maven:3.9-eclipse-temurin-21
    restart: unless-stopped
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-broiler_monitoring}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-broiler}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-broiler_password}
      POSTGRES_DB: ${POSTGRES_DB:-broiler_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-broiler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-broiler_password}
      POSTGRES_PORT: 5432
      TELEMETRY_INFLUX_URL: http://influxdb:8086
      TELEMETRY_INFLUX_DATABASE: ${INFLUXDB_DB:-broiler_telemetry}
      SENSOR_SIMULATION_ENABLED: "true"
      SENSOR_SIMULATION_TARGET_URL: http://localhost:8080/api/v1/telemetry/readings
      SENSOR_SIMULATION_GATEWAY_ID: GW-FARM-1-HOUSE-4
      SENSOR_SIMULATION_INTERVAL_MS: 600000
      SENSOR_SIMULATION_INITIAL_DELAY_MS: 15000
      INCIDENT_ATTACHMENTS_S3_ENDPOINT: http://minio:9000
      INCIDENT_ATTACHMENTS_S3_REGION: ${INCIDENT_ATTACHMENTS_S3_REGION:-us-east-1}
      INCIDENT_ATTACHMENTS_S3_BUCKET: ${INCIDENT_ATTACHMENTS_S3_BUCKET:-broiler-incident-attachments}
      INCIDENT_ATTACHMENTS_S3_ACCESS_KEY: ${INCIDENT_ATTACHMENTS_S3_ACCESS_KEY:-minioadmin}
      INCIDENT_ATTACHMENTS_S3_SECRET_KEY: ${INCIDENT_ATTACHMENTS_S3_SECRET_KEY:-minioadmin}
      INCIDENT_ATTACHMENTS_S3_PATH_STYLE_ACCESS: "true"
      INCIDENT_ATTACHMENTS_MAX_FILE_SIZE: ${INCIDENT_ATTACHMENTS_MAX_FILE_SIZE:-300MB}
      INCIDENT_ATTACHMENTS_MAX_REQUEST_SIZE: ${INCIDENT_ATTACHMENTS_MAX_REQUEST_SIZE:-900MB}
      INCIDENT_ATTACHMENTS_MAX_FILE_SIZE_BYTES: ${INCIDENT_ATTACHMENTS_MAX_FILE_SIZE_BYTES:-314572800}
    ports:
      - "8081:8080"
    volumes:
      - ./backend/broiler_monitoring:/app
      - maven_cache:/root/.m2
      - backend_target:/app/target
    command: mvn -Dmaven.repo.local=/root/.m2/repository-clean -DskipTests spring-boot:run
    networks:
      - broiler-network

  frontend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    environment:
      SPRING_API_URL: http://backend:8080
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: sh -c "npm ci && npm run build && npm run start -- -H 0.0.0.0 -p 3000"
    networks:
      - broiler-network

volumes:
  postgres_data:
  influxdb_data:
  grafana_data:
  minio_data:
  maven_cache:
  backend_target:
  frontend_node_modules:
  frontend_next:

networks:
  broiler-network:
    driver: bridge
